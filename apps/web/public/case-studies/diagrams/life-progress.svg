<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" role="img" aria-labelledby="life-progress-title life-progress-desc">
<title id="life-progress-title">A motivation loop that allows recovery</title><desc id="life-progress-desc">Choose an action, show up, reflect on the result, then adjust and return.</desc>
<defs><marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="560" height="440" fill="#fafafa"/>
<g font-family="Arial, Helvetica, sans-serif"><path d="M 240 100 H 320" fill="none" stroke="#a1a1aa" stroke-width="2"  marker-end="url(#arrow-normal)"/><path d="M 420 144 V 248" fill="none" stroke="#a1a1aa" stroke-width="2"  marker-end="url(#arrow-normal)"/><path d="M 320 292 H 240" fill="none" stroke="#a1a1aa" stroke-width="2"  marker-end="url(#arrow-normal)"/><path d="M 140 248 V 144" fill="none" stroke="#7c3aed" stroke-width="2"  marker-end="url(#arrow-accent)"/><rect x="40" y="56" width="200" height="88" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="140.0" y="95.0" text-anchor="middle" font-size="24" font-weight="600" fill="#27272a">Choose</text><text x="140.0" y="122.0" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">A small commitment</text><rect x="320" y="56" width="200" height="88" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="420.0" y="95.0" text-anchor="middle" font-size="24" font-weight="600" fill="#27272a">Show up</text><text x="420.0" y="122.0" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">Record the effort</text><rect x="320" y="248" width="200" height="88" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="420.0" y="287.0" text-anchor="middle" font-size="24" font-weight="600" fill="#27272a">Reflect</text><text x="420.0" y="314.0" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">See what happened</text><rect x="40" y="248" width="200" height="88" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="140.0" y="287.0" text-anchor="middle" font-size="24" font-weight="600" fill="#7c3aed">Return</text><text x="140.0" y="314.0" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">Adjust and try again</text><text x="280" y="200" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">A setback belongs</text><text x="280" y="228" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">inside the loop</text><text x="280" y="400" text-anchor="middle" font-size="22" font-weight="600" fill="#7c3aed">Progress should leave a way back.</text></g></svg>