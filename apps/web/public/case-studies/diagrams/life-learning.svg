<g font-family="Arial, Helvetica, sans-serif"><path d="M 280 92 V 108" fill="none" stroke="#a1a1aa" stroke-width="2"  marker-end="url(#arrow-normal)"/><path d="M 280 172 V 188" fill="none" stroke="#a1a1aa" stroke-width="2"  marker-end="url(#arrow-normal)"/><path d="M 280 252 V 268" fill="none" stroke="#a1a1aa" stroke-width="2"  marker-end="url(#arrow-normal)"/><path d="M 280 332 V 348" fill="none" stroke="#a1a1aa" stroke-width="2"  marker-end="url(#arrow-normal)"/><rect x="52" y="28" width="456" height="64" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="280.0" y="55.0" text-anchor="middle" font-size="24" font-weight="600" fill="#27272a">Capture</text><text x="280.0" y="82.0" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">Save a video or source</text><rect x="52" y="108" width="456" height="64" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="280.0" y="135.0" text-anchor="middle" font-size="24" font-weight="600" fill="#27272a">Understand</text><text x="280.0" y="162.0" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">Summary and key ideas</text><rect x="52" y="188" width="456" height="64" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="280.0" y="215.0" text-anchor="middle" font-size="24" font-weight="600" fill="#27272a">Practice</text><text x="280.0" y="242.0" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">Work through a skill</text><rect x="52" y="268" width="456" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="280.0" y="295.0" text-anchor="middle" font-size="24" font-weight="600" fill="#7c3aed">Assess</text><text x="280.0" y="322.0" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">Explain it in your own words</text><rect x="52" y="348" width="456" height="64" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="280.0" y="375.0" text-anchor="middle" font-size="24" font-weight="600" fill="#27272a">Revisit</text><text x="280.0" y="402.0" text-anchor="middle" font-size="20" font-weight="400" fill="#52525b">Keep history and review gaps</text></g></svg>